# Example configuration of the sharetoken coordinator.
#   coordinator -config /etc/sharetoken/coordinator.yaml [serve|balance|nodes|check|...]
# Admin commands read the same file (for database and identity).
# Precedence: built-in defaults < this file < command-line flags given explicitly.
# Relative paths are resolved against this file's directory. Unknown keys are an error.
# Secrets are never written here: use *_env (name of an environment variable)
# or *_file (path of a file, mode 0600).

version: 1

identity:
  key_file: coordinator.key      # the peer ID comes from it, and relays list that ID under allow_peers: back it up

# The database is shared with the portal: both files must name the same one.
database:
  # mysql://user@host:port/db
  dsn: mysql://sharetoken@127.0.0.1:3306/sharetoken
  password_env: SHARETOKEN_DB_PASSWORD   # or password_file: /etc/sharetoken/db.pass
  max_open_conns: 32
  max_idle_conns: 8
  conn_max_lifetime: 30m
  connect_timeout: 10s
  lock_wait_timeout: 10s         # innodb_lock_wait_timeout
  startup_busy_retry: 2m         # how long startup keeps retrying while another program migrates the schema

network:
  listen: []                     # empty (default): dial out only and be reached through relays; no public address needed
  # Each online user holds one relayed connection. libp2p's system-wide
  # connection and stream limits are raised to match; the other limits (16 MiB
  # per stream, streams per peer, total memory) stay.
  max_conns: 8192
  # Relays to reserve on besides those registered in the database (full
  # multiaddrs ending in /p2p/<id>).
  relays: []
  relay_sync: 15s                # how often the relay list and its state are synchronised

# Pricing and matching
market:
  fee_bps: 500                   # the platform's cut in basis points (500 = 5%)
  min_budget_micros: 1           # smallest hold of one ticket
  warm_up: 30s                   # after a restart, answer "capacity" for this long while offers arrive (buyers queue)

# Job timing. The values below are the defaults; change them only with a reason.
jobs:
  ticket_ttl: 1m                 # time a node has to start the job
  start_grace: 30s               # after the ticket expires, how long before an unstarted job is released
  reconnect_grace: 2m            # release is put off this long after the node reconnects
  max_stale_tickets: 5           # stale unstarted tickets one buyer may hold
  stale_after: 15s               # a ticket not started this long after issue is stale
  settle_grace: 15m              # extra time for a settlement to arrive
  dispute_window: 24h            # an unconfirmed settlement becomes final after this
  max_offer_ttl: 5m              # ceiling on the lifetime an offer may claim
  job_retention: 720h            # how long finished jobs are kept (the ledger is kept for good)
  suspend_for: 24h               # how long a node that keeps failing audits is left out of matching

# Reference copies of models: they turn on audits, and exact token counts in disputes.
references:
  - id: qwen2.5-7b               # model ID on the marketplace
    upstream: qwen2.5:7b         # the model's name on the server
    url: http://127.0.0.1:11434/v1
    api_key_env: ""              # environment variable holding the server's API key
    api_key_file: ""             # or a file holding it (wins)
    # How audits check a node's answers against this reference (docs/security.md):
    #   vllm             self-hosted vLLM/SGLang: token-level check, one call per answer
    #   deepseek-prefix  DeepSeek API: token-level check through prefix completion, one call per token
    #   openai-div       OpenAI API: first-divergence check on the reference's own logprobs
    #   none             the reference reports no logprobs: only the bill is checked
    verify: none
    verify_url: ""               # base URL audits score against; empty: url
    # params: {reasoning_effort: none}   # extra fields of audit requests (a model that thinks by default)

audit:
  interval: 10m                  # mean time between audits; 0 turns them off
  budget_micros: 200000          # held for each question, paid from the platform's fees
  prompts_file: ""               # private question pool, one per line: text or {"system":..,"messages":[..]}; empty: built-in open questions
  max_tokens: 96                 # output limit of a question
  questions: 5                   # questions per audit; the verdict is on all of them together
  spread: 2m                     # random pause of up to this long between an audit's questions
  score_tokens: 64               # positions scored per answer (deepseek-prefix: one call each)
  threshold: 0.85                # mean top-1 rate below which the node serves another model,
                                 # until a calibration measures one for the reference
  margin: 0.03                   # threshold + margin and above: a match; in between: inconclusive
  div_fails: 2                   # openai-div: failed answers (of questions) that make a mismatch
  shadow: true                   # record verdicts only; nodes' records are untouched
  calibrate_every: 24h           # measure each reference's honest scores (0: only by `coordinator audit calibrate`)
  calibrate_samples: 40          # questions per calibration

tee:
  policy_file: ""                # JSON allow-list of TEE images; setting it enables matching for require_tee
  online_check: false            # ask AMD and Intel about revocation and TCB status

debug:
  pprof_listen: ""               # for example 127.0.0.1:6060; loopback only

log:
  level: info
  format: text
  file: ""

# Development and test networks only. The coordinator warns loudly at startup.
dev:
  open_accounts: false           # a peer not bound to a user trades on an account of its own
  credit_micros: 0               # credit granted to each new peer on first use
