# Example configuration of the sharetoken mail server (docs/mail.md).
#   mailserver -config mail.yaml check-config    # validate it
version: 1

database:
  # The portal's database. Use an account that can only reach mail_outbox,
  # mail_inbox and mail_status: this is the one program that strangers talk to
  # directly.
  dsn: mysql://sharetoken_mail@127.0.0.1:3306/sharetoken
  password_file: mail-db.pass
  max_open_conns: 8
  max_idle_conns: 2
  conn_max_lifetime: 30m
  connect_timeout: 10s
  lock_wait_timeout: 10s

hostname: mail.example.com      # EHLO name; the MX record points at it
domain: example.com             # the domain mail is sent from and received for
from: "ShareToken <team@example.com>"  # sender of send-test; the portal's mail uses the portal's mail.from

dkim:
  selector: st1           # published at st1._domainkey.example.com
  key_file: dkim.key      # made by `mailserver dkim-keygen`; without it nothing is sent (unsigned mail fails DMARC)

delivery:
  # direct: straight to the recipient's MX (needs outbound port 25)
  # smarthost: hand everything to a relay host
  # resend: Resend's HTTPS API
  mode: direct
  smarthost:
    addr: ""              # smtp.example.com:587 (STARTTLS) or :465 (TLS); the certificate is verified either way
    username: ""
    password_file: ""
  resend:
    api_key_file: ""      # a file with the one line re_…; Resend signs with its own DKIM key, and the domain must be verified there
  workers: 4
  retry_for: 48h          # how long a temporary failure is retried (a sign-up code expires after 10 minutes anyway)
  keep_for: 2160h         # how long sent mail is kept

smtp:
  enabled: true           # false: send only, receive nothing
  listen: ":25"
  mailboxes:              # mail is accepted for these addresses only; others are refused during SMTP (550). Nothing is forwarded.
    - support@example.com
    - team@example.com
  max_message_size: 10MiB
  max_inbox_size: 2GiB    # beyond it mail is refused for now (452) and the sender retries later
  max_conns: 20
  max_conns_per_ip: 4
  max_per_ip_hour: 60
  tls:
    cert_file: ""         # reloaded after renewal; empty: a self-signed certificate (senders rarely verify, and it still encrypts)
    key_file: ""

log:
  level: info
  format: text
  file: ""
