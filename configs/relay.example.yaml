# Example configuration of a sharetoken relay.
#   relay -config /etc/sharetoken/relay.yaml
# Precedence: built-in defaults < this file < command-line flags given explicitly.
# Relative paths are resolved against this file's directory. Durations are
# written the Go way: 30s, 10m, 1h, 720h. Unknown keys are an error.

version: 1

# The relay's identity. Its address includes the peer ID, so a new key is a new
# address: every registration with a portal would have to change.
identity:
  key_file: relay.key            # created with mode 0600 if missing

network:
  # Listen addresses. IPv6 is skipped on a host without it.
  listen:
    - /ip4/0.0.0.0/tcp/4001
    - /ip4/0.0.0.0/udp/4001/quic-v1
    - /ip6/::/tcp/4001
    - /ip6/::/udp/4001/quic-v1
  # Public addresses to announce instead of the interface addresses. Needed
  # behind 1:1 NAT (most cloud hosts); list IPv6 too. /dns4 and /dns6 work.
  announce: []
  #  - /ip4/203.0.113.7/tcp/4001
  #  - /ip4/203.0.113.7/udp/4001/quic-v1
  # Connection manager high watermark. libp2p's system-wide connection and
  # stream limits are raised to match; the other limits (16 MiB per stream,
  # streams per peer, total memory) stay.
  max_conns: 8192

# Admission: who may hold a reservation on this relay.
# One relay can serve several networks (for example prod and dev). With no
# network listed the relay is open: anyone may reserve (a warning at startup).
access:
  networks:
    - name: prod
      # The portal's relay-pass public key (`portal pass-key`). Several keys
      # allow rotation. A key may appear in one network only.
      portal_keys:
        - ed25519:<prod portal pass-key hex>
      # Peers that reserve without a pass: the network's coordinator
      # (`coordinator id`). A peer may appear in one network only.
      allow_peers:
        - <prod coordinator peer id>
      # Devices of one user that may hold a reservation at once. Accounts are
      # counted per network.
      max_devices_per_user: 4
      # A private relay (one a user runs for their own devices) lists accounts
      # instead of a coordinator: only their devices may reserve.
      # `relay init -account user:3 -out relay.yaml` writes such a file, with
      # portal_url, where the relay keeps reading the portal's pass key.
      # allow_accounts: [user:3]
      # portal_url: https://sharetoken.app
    - name: dev
      portal_keys:
        - ed25519:<dev portal pass-key hex>
      allow_peers:
        - <dev coordinator peer id>
      max_devices_per_user: 4
      # Ceiling for this network's devices together (the coordinator is not
      # counted), so one network cannot crowd out another.
      # 0: only limits.max_reservations applies.
      max_reservations: 32

limits:
  max_reservations: 4096         # reservations held at once, all networks
  max_reservations_per_ip: 64    # per IP address (many users can share one behind carrier NAT)
  max_circuits: 4096             # open circuits to one destination peer (the coordinator receives one per online user)
  max_circuits_per_peer: 32      # circuits one peer may hold open at a time (a user holds one to the coordinator and one per node it buys from); at most 64
  max_circuits_per_ip: 128       # the same for all peers of one IPv4 address or IPv6 /56 together; allow_peers are not counted
  reservation_ttl: 1h            # how long a reservation lasts
  circuit_buffer: 16KiB          # buffer of each circuit

status:
  # For example 127.0.0.1:8093: JSON statistics at /, Prometheus metrics at
  # /metrics. There is no authentication, so only a loopback address is accepted.
  listen: ""
  stats_interval: 5m             # how often statistics are logged; 0 turns it off

log:
  level: info                    # debug | info | warn | error
  format: text                   # text | json
  file: ""                       # empty: stderr
