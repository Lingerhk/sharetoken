# Example configuration of the sharetoken portal.
#   portal -config /etc/sharetoken/portal.yaml serve
#   portal -config /etc/sharetoken/portal.yaml useradd -admin alice   # admin commands read the same file
# Precedence: built-in defaults < this file < command-line flags given explicitly.
# Relative paths are resolved against this file's directory. Unknown keys are an error.
# Secrets are never written here: use the *_env and *_file keys.

version: 1

# The database is shared with the coordinator.
database:
  dsn: mysql://sharetoken@127.0.0.1:3306/sharetoken
  password_env: SHARETOKEN_DB_PASSWORD   # or password_file
  max_open_conns: 32
  max_idle_conns: 8
  conn_max_lifetime: 30m
  connect_timeout: 10s
  lock_wait_timeout: 10s

keys:
  # Signs relay passes. Relays list its public key under portal_keys.
  pass_key_file: portal-pass.key
  # A 32-byte key that encrypts the administrators' TOTP secrets. Empty: derived
  # from the pass key. With its own key, rotating the pass key does not lock
  # administrators out of two-step verification.
  mfa_key_file: ""

http:
  listen: ":8092"
  # Reverse proxies on other machines whose X-Real-IP is believed (it feeds the
  # login throttle). A proxy on loopback is always believed.
  trusted_proxies: []
  read_header_timeout: 10s
  read_timeout: 30s
  write_timeout: 60s
  shutdown_timeout: 5s

tls:
  # mode:
  #   auto         with cert_file: that certificate; otherwise plain HTTP on a
  #                loopback address and a self-signed certificate elsewhere (default)
  #   files        cert_file and key_file, for example from Let's Encrypt
  #   self-signed  a self-signed certificate; clients pin its fingerprint
  #   proxy        a reverse proxy terminates TLS in front: plain HTTP here,
  #                cookies still marked Secure
  #   insecure     plain HTTP on a non-loopback address. Test networks only.
  mode: auto
  cert_file: ""
  key_file: ""
  self_signed_dir: portal-tls    # where the self-signed certificate is kept. Keep it: clients pin its fingerprint.
  self_signed_hosts: []          # names and IP addresses the self-signed certificate is issued for

accounts:
  # People sign in with a code mailed to their address; there are no passwords.
  # With open registration an address without an account gets one at its first
  # sign-in; otherwise administrators create accounts (portal useradd <email>).
  open_registration: false
  signup_credit_micros: 0        # micro-credits a new user starts with

# The sender of the portal's mail (sign-in codes, notices, replies). The portal
# only writes to the outbox; mailserver delivers it (docs/mail.md). Sign-in
# codes are mail: without a sender (here or on the settings page) and a running
# mailserver, nobody can sign in.
mail:
  from: ""     # ShareToken <team@example.com>; empty: no mail is sent, and no sign-in
  support: ""  # ShareToken Support <support@example.com>: where users write to, and where administrators reply from

alerts:
  pushover_file: ""  # PUSHOVER_TOKEN=… and PUSHOVER_USER=… lines; administrators' alerts go there. Empty: only logged

downloads:
  dir: ""      # directory of client packages, served at /downloads/; empty: none

sessions:
  login_ttl: 1440h               # lifetime of the token a client gets at sign-in (60 days)
  web_session_ttl: 360h          # lifetime of a browser session (15 days)
  pass_ttl: 1h                   # lifetime of a relay pass: a disabled user loses relay access within this time

log:
  level: info
  format: text
  file: ""
