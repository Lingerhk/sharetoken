# 生产协调器（云主机）。装到 /etc/sharetoken/coordinator/coordinator.yaml，以 st-coord 运行。
version: 1
identity:
  key_file: /etc/sharetoken/coordinator/coordinator.key       # peer ID 12D3KooWFAqCYkUS2Kt2KRWQ1mWF82Em4mRbB5nD4V7Fr5PmWfUh，中继按它放行
database:
  dsn: mysql://sharetoken_coord@127.0.0.1:3306/sharetoken
  password_file: /etc/sharetoken/coordinator/db.pass
  max_open_conns: 16
  max_idle_conns: 4
  conn_max_lifetime: 30m
  connect_timeout: 10s
  lock_wait_timeout: 10s
  startup_busy_retry: 2m
network:
  listen: []
  max_conns: 4096
  relays: []                      # 中继以门户登记的为准
  relay_sync: 15s
market:
  fee_bps: 500
  min_budget_micros: 1
  warm_up: 30s
jobs:
  ticket_ttl: 1m
  start_grace: 30s
  reconnect_grace: 2m
  max_stale_tickets: 5
  stale_after: 15s
  settle_grace: 15m
  dispute_window: 24h
  max_offer_ttl: 5m
  job_retention: 720h
  suspend_for: 24h
# 参考模型（争议时精确计 token）：Mac 上 scripts/upstream_proxy.py（公司采购的 API），
# 经 scripts/testenv/tunnels.sh 建的反向隧道出现在这台主机的回环端口上。隧道不在时只影响争议裁决。
references:
  - {id: deepseek-flash, upstream: deepseek-flash, url: "http://127.0.0.1:11434/v1"}
  - {id: gpt-4o-mini, upstream: gpt-4o-mini, url: "http://127.0.0.1:11436/v1"}
audit:
  interval: 0                     # 商业模型非确定，相似度抽检会误判且花钱：关闭
  budget_micros: 200000
  prompts_file: ""
  max_tokens: 96
  match_at: 0.8
  mismatch_below: 0.4
tee:
  policy_file: ""
  online_check: false
debug:
  pprof_listen: ""
log:
  level: info
  format: text
  file: ""
dev:
  open_accounts: false
  credit_micros: 0
