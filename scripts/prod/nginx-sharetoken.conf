# /etc/nginx/conf.d/sharetoken.conf —— sharetoken.app 的 TLS 终结与反代（armbian 上与 sgvpn 站点共存）
server {
    listen 80;
    listen [::]:80;
    server_name sharetoken.app www.sharetoken.app;

    # Let's Encrypt webroot 续期，必须对全网开放
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://sharetoken.app$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.sharetoken.app;
    ssl_certificate     /etc/letsencrypt/live/sharetoken.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sharetoken.app/privkey.pem;
    return 301 https://sharetoken.app$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sharetoken.app;

    ssl_certificate     /etc/letsencrypt/live/sharetoken.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sharetoken.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:st_ssl:2m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;                 # 门户只在对端是回环时采信，用于登录失败限流
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
