# 生产邮件服务（云主机）。装到 /etc/sharetoken/mail/mail.yaml，以 st-mail 运行。team-dev@、support-dev@ 也在这里收：MX 只有一个，dev 邮件的退信和回复会到这里。
version: 1
database:
  dsn: mysql://sharetoken_mail@127.0.0.1:3306/sharetoken
  password_file: /etc/sharetoken/mail/db.pass
  max_open_conns: 8
  max_idle_conns: 2
  conn_max_lifetime: 30m
  connect_timeout: 10s
  lock_wait_timeout: 10s
hostname: mail.sharetoken.app
domain: sharetoken.app
from: "ShareToken <team@sharetoken.app>"
dkim:
  selector: st1
  key_file: /etc/sharetoken/mail/dkim.key
delivery:
  # DigitalOcean 封了出站 25、465、587，所以发信走 Resend 的 HTTPS API（docs/mail.md）。
  # Resend 用它自己的 DKIM（resend._domainkey）签名；dkim.key 仍保留，dkim 段是必填项。
  mode: resend
  resend:
    api_key_file: /etc/sharetoken/mail/resend.key   # deploy.sh 从 ~/st-test/prod-keys/resend.key 安装
  workers: 4
  retry_for: 48h
  keep_for: 2160h
smtp:
  enabled: true
  listen: ":25"
  mailboxes:
    - support@sharetoken.app
    - team@sharetoken.app
    - team-dev@sharetoken.app
    - support-dev@sharetoken.app
  max_message_size: 10MiB
  max_inbox_size: 2GiB
  max_conns: 20
  max_conns_per_ip: 4
  max_per_ip_hour: 60
  tls:
    cert_file: /etc/sharetoken/mail/tls/fullchain.pem
    key_file: /etc/sharetoken/mail/tls/privkey.pem
log:
  level: info
  format: text
  file: ""
