# 生产门户（云主机）。装到 /etc/sharetoken/portal/portal.yaml，以 st-portal 运行（scripts/ops/st-host-setup.sh）。nginx 终结 TLS（Let's Encrypt），门户只听回环。
version: 1
database:
  dsn: mysql://sharetoken_portal@127.0.0.1:3306/sharetoken
  password_file: /etc/sharetoken/portal/db.pass
  max_open_conns: 16
  max_idle_conns: 4
  conn_max_lifetime: 30m
  connect_timeout: 10s
  lock_wait_timeout: 10s
keys:
  pass_key_file: /etc/sharetoken/portal/portal-pass.key
  mfa_key_file: ""
http:
  listen: "127.0.0.1:8092"
  read_header_timeout: 10s
  read_timeout: 30s
  write_timeout: 60s
  shutdown_timeout: 5s
tls:
  mode: proxy                     # 纯 HTTP + Secure Cookie；nginx 加 X-Forwarded-Proto / X-Real-IP
accounts:
  open_registration: true         # 自助注册，必须有邮箱验证码（docs/mail.md）
  signup_credit_micros: 5000000
  email_verification: true
mail:
  from: "ShareToken <team@sharetoken.app>"
  support: "ShareToken Support <support@sharetoken.app>"
downloads:
  dir: /var/lib/sharetoken/portal/downloads   # 客户端安装包，deploy.sh 上传到这里，门户在 /downloads/ 提供下载
sessions:
  login_ttl: 720h
  web_session_ttl: 24h
  pass_ttl: 1h
log:
  level: info
  format: text
  file: ""
