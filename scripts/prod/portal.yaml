# 生产门户（armbian）。部署到 ~/sharetoken-prod/portal.yaml。nginx 终结 TLS（Let's Encrypt），门户只听回环。
version: 1
database:
  dsn: mysql://sharetoken@127.0.0.1:3306/sharetoken
  password_file: db.pass
  max_open_conns: 16
  max_idle_conns: 4
  conn_max_lifetime: 30m
  connect_timeout: 10s
  lock_wait_timeout: 10s
keys:
  pass_key_file: portal-pass.key
  mfa_key_file: ""
http:
  listen: "127.0.0.1:8092"
  read_header_timeout: 10s
  read_timeout: 30s
  write_timeout: 60s
  shutdown_timeout: 5s
tls:
  mode: proxy                     # 纯 HTTP + Secure Cookie；nginx 加 X-Forwarded-Proto / X-Real-IP
accounts:
  open_registration: false        # 公司内部：只由管理员建号
  signup_credit_micros: 5000000
sessions:
  login_ttl: 720h
  web_session_ttl: 24h
  pass_ttl: 1h
log:
  level: info
  format: text
  file: ""
