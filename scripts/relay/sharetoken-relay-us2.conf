# relay-us2 的 drop-in（/etc/systemd/system/sharetoken-relay.service.d/us2.conf，install-service.sh 安装）。
# 这台也跑生产门户、协调器和 MySQL（1 GB 内存），所以中继用单独的 st-relay 用户、加固并限内存。
[Service]
Group=st-relay
# 身份密钥 /var/lib/sharetoken-relay/relay.key，只有 st-relay 能读；程序和配置在 /srv/sharetoken-relay（s0nnet 发布，只读）
StateDirectory=sharetoken-relay
StateDirectoryMode=0700
Environment=GOMEMLIMIT=160MiB
MemoryMax=300M
CapabilityBoundingSet=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
UMask=0077
