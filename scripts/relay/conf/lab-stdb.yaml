# 实验中继（orb VM st-db，~/st-test/relay-lab/）。只信任 dev，生产不登记，压测和 chaos 可以随便动它。
# OrbStack 把 VM 的端口转发到 Mac 的局域网地址，所以局域网内（Pi、Mac、orb）可达；公网用户走 lab-cn2。
version: 1
identity:
  key_file: relay.key
network:
  listen: [/ip4/0.0.0.0/tcp/4101]
  announce: [/ip4/192.168.6.125/tcp/4101]   # Mac 的局域网 IP；变了要改这里并在 dev 门户重新登记
  max_conns: 8192
access:
  networks:
    - name: dev
      portal_keys: [ed25519:5262c7de2eb39f527d515a36082293f1c3426aaaf583883ad71312ad223ed011]
      allow_peers: [12D3KooWDa9b2HPSjHYhxuVGhKQ1866qAsGTKmgwEB5oY4D7qSYt]
      max_devices_per_user: 64  # 压测用很多设备
limits:
  max_reservations: 4096
  max_reservations_per_ip: 4096
  max_circuits: 4096
  reservation_ttl: 1h
  circuit_buffer: 16KiB
status:
  listen: 127.0.0.1:8094
  stats_interval: 5m
log:
  level: info
  format: text
  file: ""
