# relay-us2 的监控配置，scripts/relay/deploy-monitor.sh 部署到 ~/st-test/monitor.ini。可调项和默认值见 monitor.py 的 DEFAULTS。
[monitor]
name = relay-us2
url = http://127.0.0.1:8093/metrics
tcp = relay-us2.sharetoken.app:4001
# US→SG→EU→US2→US 环形互盯：机器彻底宕机时，它自己发不出告警
watch = relay-us.sharetoken.app:4001
# 中继程序不在 ~/st-test，在 /srv/sharetoken-relay（以 st-relay 运行）
binary = /srv/sharetoken-relay/relay
