# relay-us2：prod 和 dev 共用，属于生产设施，用 scripts/relay/deploy.sh 发布。
# 和生产门户同机（165.227.3.194，DigitalOcean sfo2，1 GB 内存），所以单独以 st-relay 用户运行、限额调低：
# 程序和配置在 /srv/sharetoken-relay（s0nnet 发布），身份密钥在 /var/lib/sharetoken-relay（只有 st-relay 能读）。
version: 1
identity:
  key_file: /var/lib/sharetoken-relay/relay.key
network:
  listen:
    - /ip4/0.0.0.0/tcp/4001
    - /ip4/0.0.0.0/udp/4001/quic-v1
    - /ip6/::/tcp/4001
    - /ip6/::/udp/4001/quic-v1
  announce:            # 域名（docs/prod-env.md），A + AAAA 都有
    - /dns4/relay-us2.sharetoken.app/tcp/4001
    - /dns4/relay-us2.sharetoken.app/udp/4001/quic-v1
    - /dns6/relay-us2.sharetoken.app/tcp/4001
    - /dns6/relay-us2.sharetoken.app/udp/4001/quic-v1
  max_conns: 4096
access:
  networks:
    - name: prod
      portal_keys: [ed25519:0c8928fec72a6b1502eb83e8104cfdc56d740c54d040e18a7eed05edaaeb8dc3]
      allow_peers: [12D3KooWFAqCYkUS2Kt2KRWQ1mWF82Em4mRbB5nD4V7Fr5PmWfUh]
      max_devices_per_user: 4
    - name: dev                # 只占有限名额；压测、chaos 不走这里，走实验中继（docs/dev-env.md）
      portal_keys: [ed25519:5262c7de2eb39f527d515a36082293f1c3426aaaf583883ad71312ad223ed011]
      allow_peers: [12D3KooWDa9b2HPSjHYhxuVGhKQ1866qAsGTKmgwEB5oY4D7qSYt]
      max_devices_per_user: 4
      max_reservations: 32
limits:
  max_reservations: 2048
  max_reservations_per_ip: 64
  max_circuits: 2048
  reservation_ttl: 1h
  circuit_buffer: 16KiB
status:
  listen: 127.0.0.1:8093
  stats_interval: 5m
log:
  level: info
  format: text
  file: ""
