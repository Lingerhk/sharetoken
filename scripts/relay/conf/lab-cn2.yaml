# 实验中继（腾讯云 101.43.2.87，共用机器：127.0.0.1:4001 被 QQ 占用，所以用 4002；无公网 IPv6）。只信任 dev，生产不登记，压测和 chaos 可以随便动它。部署到 ~/st-test/relay.yaml
version: 1
identity:
  key_file: relay.key
network:
  listen:
    - /ip4/0.0.0.0/tcp/4002
    - /ip4/0.0.0.0/udp/4002/quic-v1
  announce:            # 域名（docs/prod-env.md），只有 A 记录
    - /dns4/relay-cn2.sharetoken.app/tcp/4002
    - /dns4/relay-cn2.sharetoken.app/udp/4002/quic-v1
  max_conns: 8192
access:
  networks:
    - name: dev
      portal_keys: [ed25519:5262c7de2eb39f527d515a36082293f1c3426aaaf583883ad71312ad223ed011]
      allow_peers: [12D3KooWDa9b2HPSjHYhxuVGhKQ1866qAsGTKmgwEB5oY4D7qSYt]
      max_devices_per_user: 64  # 压测用很多设备
limits:
  max_reservations: 4096
  max_reservations_per_ip: 64
  max_circuits: 4096
  reservation_ttl: 1h
  circuit_buffer: 16KiB
status:
  listen: 127.0.0.1:8093
  stats_interval: 5m
log:
  level: info
  format: text
  file: ""
