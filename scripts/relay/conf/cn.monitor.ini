# relay-cn 的监控配置，scripts/relay/deploy-monitor.sh 部署到 ~/st-test/monitor.ini。可调项和默认值见 monitor.py 的 DEFAULTS。
[monitor]
name = relay-cn
url = http://127.0.0.1:8093/metrics
tcp = relay-cn.sharetoken.app:8091
# 和 lab-cn2 互相盯，走境内链路；跨境丢包太重，不和 US、SG 互盯。lab-cn2 是实验中继，只算 warning
watch = relay-cn2.sharetoken.app:4002
watch_severity = warning
