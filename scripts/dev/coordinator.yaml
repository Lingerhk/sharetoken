# dev 协调器（树莓派）。部署到 ~/sharetoken-dev/coordinator.yaml。
version: 1
identity:
  key_file: coordinator.key       # dev 专用，绝不和生产混用；peer ID 在 scripts/relay/conf/*.yaml 的 dev 网络里
database:
  # armbian 上生产 MySQL 实例里的独立库和账号，经 SSH 隧道到达（sharetoken-dev-dbtunnel.service）
  dsn: mysql://sharetoken_dev@127.0.0.1:3306/sharetoken_dev
  password_file: db.pass
  max_open_conns: 8
  max_idle_conns: 2
  conn_max_lifetime: 30m
  connect_timeout: 10s
  lock_wait_timeout: 10s
  startup_busy_retry: 2m
network:
  listen: []
  max_conns: 512
  relays: []                      # 中继以 dev 门户登记的为准
  relay_sync: 15s
market:
  fee_bps: 500
  min_budget_micros: 1
  warm_up: 30s
jobs:
  ticket_ttl: 1m
  start_grace: 30s
  reconnect_grace: 2m
  max_stale_tickets: 5
  stale_after: 15s
  settle_grace: 15m
  dispute_window: 24h
  max_offer_ttl: 5m
  job_retention: 720h
  suspend_for: 24h
references: []                    # dev 只用 mock 模型，不放公司采购的 API
audit:
  interval: 0
debug:
  pprof_listen: ""
log:
  level: info
  format: text
  file: ""
dev:
  open_accounts: false            # 这个开关让任意 peer 交易，不是给 dev 环境用的，保持关闭
  credit_micros: 0
