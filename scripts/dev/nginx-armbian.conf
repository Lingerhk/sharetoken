# armbian /etc/nginx/conf.d/sharetoken-dev.conf：dev.sharetoken.app 的公网入口，转发到树莓派。
server {
    listen 80;
    listen [::]:80;
    server_name dev.sharetoken.app;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://dev.sharetoken.app$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.sharetoken.app;

    ssl_certificate     /etc/letsencrypt/live/dev.sharetoken.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.sharetoken.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://192.168.6.148:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;                 # 门户 http.trusted_proxies 里列了本机，用于登录失败限流
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
