# dev 门户（armbian）。装到 /etc/sharetoken-dev/portal/portal.yaml，以 st-portal 运行（scripts/ops/st-host-setup.sh）。
# TLS 在本机 nginx 终结，门户只听回环。
version: 1
database:
  dsn: mysql://sharetoken_dev_portal@127.0.0.1:3306/sharetoken_dev
  password_file: /etc/sharetoken-dev/portal/db.pass
  max_open_conns: 8
  max_idle_conns: 2
  conn_max_lifetime: 30m
  connect_timeout: 10s
  lock_wait_timeout: 10s
keys:
  pass_key_file: /etc/sharetoken-dev/portal/portal-pass.key  # dev 专用，绝不和生产混用；公钥在 scripts/relay/conf/*.yaml 的 dev 网络里
  mfa_key_file: ""
http:
  listen: "127.0.0.1:8092"
  public_url: https://dev.sharetoken.app  # 邮件里的链接（找回密码）；只在这里设置
  read_header_timeout: 10s
  read_timeout: 30s
  write_timeout: 60s
  shutdown_timeout: 5s
tls:
  mode: proxy
accounts:
  open_registration: true         # 公网可达，但必须有邮箱验证码；dev 只有 mock 模型
  signup_credit_micros: 5000000
  email_verification: true
  mfa_issuer: ShareToken-dev      # Google Authenticator 里显示的名称
mail:
  from: "ShareToken Dev <team-dev@sharetoken.app>"
  support: "ShareToken Dev Support <support-dev@sharetoken.app>"
downloads:
  dir: /var/lib/sharetoken-dev/portal/downloads   # 客户端安装包，deploy.sh 上传到这里，门户在 /downloads/ 提供下载
# 管理后台仪表盘经 SSH 读中继的 /metrics。钥匙在中继上被 restrict + command= 锁死，只能读指标
# （scripts/relay/authorize-metrics.sh dev …）；主机公钥固定在 relay-metrics.known_hosts。
# 加减中继要同步改 sharetoken-dev-portal.service 的 IPAddressAllow。
relay_metrics:
  key_file: /etc/sharetoken-dev/portal/relay-metrics.key
  known_hosts_file: /etc/sharetoken-dev/portal/relay-metrics.known_hosts
  interval: 1m
  timeout: 20s
  targets:   # relay 是门户登记表里的名称
    - {relay: relay-us, ssh: s0nnet@165.227.115.27}
    - {relay: relay-sg, ssh: s0nnet@201.79.122.100}
    - {relay: relay-eu, ssh: s0nnet@164.92.157.227}
    - {relay: relay-us2, ssh: s0nnet@165.227.3.194}
    - {relay: relay-cn, ssh: s0nnet@119.29.250.173}
    - {relay: lab-cn2, ssh: orcatermuser@101.43.2.87}
sessions:
  login_ttl: 720h
  web_session_ttl: 24h
  pass_ttl: 1h
log:
  level: info
  format: text
  file: ""
