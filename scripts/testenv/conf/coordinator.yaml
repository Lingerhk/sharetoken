# st-db 上的协调器。部署到 ~/st-test/coordinator.yaml，启动：./coordinator -config coordinator.yaml
version: 1
identity:
  key_file: coordinator.key
database:
  dsn: mysql://sharetoken@127.0.0.1:3306/sharetoken
  password_file: db.pass          # 0600，内容即 SHARETOKEN_DB_PASSWORD
  max_open_conns: 32
  max_idle_conns: 8
  conn_max_lifetime: 30m
  connect_timeout: 10s
  lock_wait_timeout: 10s
  startup_busy_retry: 2m
network:
  listen: []
  max_conns: 8192
  relays: []                      # 中继以 portal 登记的为准
  relay_sync: 15s
market:
  fee_bps: 500
  min_budget_micros: 1
  warm_up: 30s
jobs:
  ticket_ttl: 1m
  start_grace: 30s
  reconnect_grace: 2m
  max_stale_tickets: 5
  stale_after: 15s
  settle_grace: 15m
  dispute_window: 24h
  max_offer_ttl: 5m
  job_retention: 720h
  suspend_for: 24h
# 参考模型：经 Mac 上 scripts/upstream_proxy.py（公司采购的 API）。用于争议时精确计 token。
references:
  - {id: deepseek-flash, upstream: deepseek-flash, url: "http://host.orb.internal:11434/v1"}
  - {id: gpt-4o-mini, upstream: gpt-4o-mini, url: "http://host.orb.internal:11436/v1"}
audit:
  # 商业模型非确定（deepseek-flash 还带推理），相似度抽检会误判并停掉节点，且每次抽检都要花钱：关闭
  interval: 0
  budget_micros: 200000
  prompts_file: ""
  max_tokens: 96
  match_at: 0.8
  mismatch_below: 0.4
tee:
  policy_file: ""
  online_check: false
debug:
  pprof_listen: 127.0.0.1:6060
log:
  level: info
  format: text
  file: ""
dev:
  open_accounts: false
  credit_micros: 0
